<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#001E60" />
    <title>Offline | FBLC</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <style>
      :root { color-scheme: light; }
      html, body { margin: 0; min-height: 100%; background: #001e60; color: #ffffff; }
      body {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        box-sizing: border-box;
        font-family: "Open Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main { width: 100%; max-width: 420px; text-align: center; }
      img { height: 88px; width: auto; }
      h1 { font-family: "Work Sans", "Open Sans", system-ui, sans-serif; font-size: 1.75rem; margin: 24px 0 8px; font-weight: 800; letter-spacing: -0.02em; }
      p { margin: 0 auto; max-width: 36ch; line-height: 1.6; color: rgba(255, 255, 255, 0.82); }
      button {
        margin-top: 28px;
        min-height: 48px;
        padding: 0 22px;
        border: 0;
        border-radius: 2px;
        background: #ffffff;
        color: #001e60;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button:focus-visible { outline: 3px solid #7fa3dd; outline-offset: 3px; }
      .rule { display: block; width: 48px; height: 4px; background: #bf0d3e; margin: 24px auto 0; }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand/fblc-logo-white.webp" alt="FBLC" />
      <h1>You are offline</h1>
      <p>FBLC needs a connection to save your answers and load your practice. Reconnect, then try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
      <span class="rule" aria-hidden="true"></span>
    </main>
  </body>
</html>
